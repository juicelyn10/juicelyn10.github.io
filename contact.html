  <style>

   #urvid {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
  object-fit: cover;
    }
   body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f5f7fa;
      color: #333;
      scroll-behavior: smooth;
   }
    header {

      background: #1e1e2f;
      padding:25px 0;
      position:sticky;
      top: 0;
      z-index: 100;
    }
    .content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: #f1f1f1;
      padding: 20px;
      border-radius: 10px;
      text-align: justify;
    }

    #pause_button {
      width: 200px;
      font-size: 18px;
      padding: 10px;
      border: none;
      background: #000;
      color: #fff;
      cursor: pointer;
      border-radius: 3px;
    }
    #pause_button:hover {
      background: #ddd;
      color: #000;
    }
* Title styling */
.title-content {
  text-align:right;
  margin-top: 50px;
}

.title {
  font-size: 60px;
  font-family: Arial, sans-serif;
  color:  #1e1e2f;
  text-shadow: 2px 2px 8px rgb(71, 110, 227);
  letter-spacing: 5px;
  text-align: center;
}

/* Content section (marquee) */
.content {

  margin: 40px auto;
  width: 90%;
  background: rgba(0, 0, 0, 0.5);
  padding: 20px;
  border-radius: 15px;
}

.content img {
  border-radius: 10px;
  margin: 0 10px;
  box-shadow: 2px 2px 10px black;
  transition: transform 0.3s;
}

.content img:hover {
  transform: scale(1.1);
}


/* Button styling */
.button-container {
  text-align:center;
  margin: 20px;
}

    .scroll-container {
      margin-top: 15px;
      background-color: transparent;
      overflow-x: auto;
      white-space: nowrap;
      padding: 5px;

    }
    .scroll-container img {
      display: inline-block;
      margin-right: 10px;
      border-radius: 8px;
    }
    .container { width: 90%; max-width: 1100px; margin: auto; }
    .logo { color: #fff; font-size: 1.8rem; margin: 0; }
    nav { float: right; }
    nav a {
      color: #fff;
      margin-left: 25px;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    
    /* CONTACT SECTION */
    .contact-section {
      max-width: 1000px;
      margin: 60px auto;
      padding: 30px;
      background: #3b3f4a;
      border-radius: 10px;
      box-shadow: 0 0 20px  rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      color: #fff;
    }

    .contact-form {
      flex: 1;
      min-width: 300px;

      padding: 20px;
    }

    .contact-info {
      flex: 1;
      min-width: 250px;
      padding: 20px;
      border-left: 2px solid #555;
    }
    .contact-form h2 {
      text-align: center;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .contact-form p {
      text-align: center;
      color: #ffffff;
      font-size: 14px;
    }

    input, textarea {
      width: 95%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #333;
      font-size: 15px;
      outline: none;
    }

    textarea {
      resize: none;
      height: 120px;
    }

    .captcha {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .captcha-box {
      background: #fff;
      color: #000;
      padding: 10px 20px;
      font-weight: 700;
      letter-spacing: 4px;
      border-radius: 5px;
      user-select: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #00aaff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;

    }

    button:hover {
      background: #0088cc;
    }

    .contact-info h3 {
      color: #00aaff;
      margin-top: 0;
    }

    .contact-info p {
      margin: 8px 0;
      color: #ffffff;
      font-size: 15px;
      
    }

    .contact-info a {
      color: #00aaff;
      text-decoration: none;
    }

    .social-icons {

      margin-top: 20px;
    }

    .social-icons a {
      color: #ffffff;
      text-decoration: none;
      margin-right: 10px;
      font-size: 20px;
      transition: color 0.3s;
    }

    .social-icons a:hover {
      color: #00aaff;
    }

    @media (max-width: 768px) {
      .contact-section {
        flex-direction: column;
        text-align: center;
      }
      .contact-info {
        border: none;

      }
  
    }
  </style>
</head>

 <body>

      </div>
  </section>

</body>
</html>
